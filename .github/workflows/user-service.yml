name: user-service

on:
  push:
    paths:
      - 'python_src/user/**'
      - '.github/workflows/user-service.yml'
  pull_request:
    paths:
      - 'python_src/user/**'
      - '.github/workflows/user-service.yml'

concurrency:
  group: user-service-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: acecoder121/codear-microservices

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: python_src/user

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_USER: postgres
      PASSWORD: postgres
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: postgres
      DB_SSL_MODE: disable
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      REDIS_SSL: 'false'
      JWT_SECRET: test-secret
      JWT_EXPIRY: '60'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: pip
          cache-dependency-path: python_src/user/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest

  build-and-push:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: python_src/user
          push: true
          tags: |
            ${{ env.IMAGE }}:user
            ${{ env.IMAGE }}:user-${{ github.sha }}
          cache-from: type=gha,scope=user
          cache-to: type=gha,mode=max,scope=user
