name: engine-service

on:
  push:
    paths:
      - 'java_src/engine/**'
      - '.github/workflows/engine-service.yml'
  pull_request:
    paths:
      - 'java_src/engine/**'
      - '.github/workflows/engine-service.yml'

concurrency:
  group: engine-service-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: acecoder121/codear-microservices

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: java_src/engine

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run tests
        run: ./mvnw -B test

  build-and-push:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: java_src/engine
          push: true
          tags: |
            ${{ env.IMAGE }}:engine
            ${{ env.IMAGE }}:engine-${{ github.sha }}
          cache-from: type=gha,scope=engine
          cache-to: type=gha,mode=max,scope=engine
