name: problem-service

on:
  push:
    paths:
      - 'python_src/problem/**'
      - '.github/workflows/problem-service.yml'
      - 'python_src/deploy_lambda.sh'
  pull_request:
    paths:
      - 'python_src/problem/**'
      - '.github/workflows/problem-service.yml'
      - 'python_src/deploy_lambda.sh'

concurrency:
  group: problem-service-${{ github.ref }}
  cancel-in-progress: true

env:
  DEPLOY_ROLE: arn:aws:iam::829108230523:role/codear-github-deploy

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: python_src/problem

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_USER: postgres
      PASSWORD: postgres
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: postgres
      DB_SSL_MODE: disable
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      REDIS_SSL: 'false'
      JWT_SECRET: test-secret
      SQS_ACCESS_KEY: test
      SQS_SECRET_KEY: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: python_src/problem/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Short-lived AWS credentials through GitHub OIDC; the role can only update and invoke the Codear Lambdas.
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE }}
          aws-region: ap-south-1

      - name: Deploy to Lambda
        run: ./python_src/deploy_lambda.sh problem
