global:
  scrape_interval: 60s
  scrape_timeout: 15s
  external_labels:
    host: codear-ap-south

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['127.0.0.1:9090']

  - job_name: node
    static_configs:
      - targets: ['127.0.0.1:9100']

  - job_name: docker
    static_configs:
      - targets: ['127.0.0.1:9323']